<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Persistencia</title>
    <!--
      Estrutura HTML da Aula 2.
      Este ficheiro define apenas layout/estilo; a lógica está em `app.js`.
    -->
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 20px;
      }
      input, select {
        padding: 8px;
        margin-right: 8px;
      }
      button {
        padding: 8px 10px;
        margin-right: 6px;
      }
      li {
        margin: 8px 0;
      }
      .muted {
        opacity: 0.72;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>Items</h1>

    <section>
      <h2>Preferencias locais</h2>
      <div class="row">
        <label>
          Tema:
          <select id="theme">
            <option value="light">light</option>
            <option value="dark">dark</option>
          </select>
        </label>
        <span class="muted">Guardado no browser com localStorage</span>
      </div>
    </section>

    <hr />

    <section>
      <h2>Criar item</h2>
      <div class="row">
        <input id="title" placeholder="titulo" />
        <input id="tags" placeholder="tags (virgula)" />
        <button id="create">Criar</button>
      </div>
      <div id="msg" class="muted"></div>
    </section>

    <section>
      <h2>Lista</h2>
      <ul id="list"></ul>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
