<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz via API externa</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 20px;
        max-width: 720px;
      }
      input, select, button {
        padding: 8px;
        margin-right: 6px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .muted {
        opacity: 0.72;
        font-size: 12px;
      }
      .question {
        margin: 16px 0;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      ul.answers {
        list-style: none;
        padding: 0;
      }
      ul.answers li {
        margin: 6px 0;
      }
      ul.answers button {
        width: 100%;
        text-align: left;
      }
      .error {
        color: #a51923;
      }
    </style>
  </head>
  <body>
    <h1>Quiz via API externa</h1>
    <p class="muted">
      Exemplo do padrão UI → Gateway → API externa. O browser nunca chama directamente a API externa.
    </p>

    <div class="row">
      <label>
        Categoria:
        <input id="category" placeholder="general" value="general" />
      </label>
      <label>
        Dificuldade:
        <select id="difficulty">
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
      </label>
      <button id="ask">Nova pergunta</button>
    </div>

    <div id="status" class="muted"></div>

    <div id="question-area"></div>

    <script src="./app.js"></script>
  </body>
</html>
